name: Branch Automation

on:
  pull_request:
    branches: [dev, stage, main]
    types: [opened, reopened, synchronize, ready_for_review, labeled, unlabeled, edited, closed]
  push:
    branches: [stage]
  workflow_dispatch:
    inputs:
      flow:
        description: "Manual flow to run"
        required: true
        type: choice
        options:
          - create-dev-to-stage
          - create-stage-to-main

permissions:
  contents: write
  pull-requests: write

jobs:
  main-merge-owner-only:
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'main' }}
    runs-on: ubuntu-latest
    steps:
      - name: Enforce owner-only PRs to main
        uses: actions/github-script@v7
        with:
          script: |
            const actor = context.actor;
            const owner = context.repo.owner;
            const headRef = context.payload.pull_request.head.ref;

            if (headRef !== 'stage') {
              core.setFailed(`PRs to main must come from stage. Current head branch is '${headRef}'.`);
              return;
            }

            if (actor !== owner) {
              core.setFailed(`Only repository owner '${owner}' can create/update PRs targeting main. Triggered by '${actor}'.`);
              return;
            }

            core.info(`Policy passed: PR to main is from stage and triggered by owner '${owner}'.`);

  freeze-dev-during-stage-cut:
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'dev' }}
    runs-on: ubuntu-latest
    steps:
      - name: Block dev merges while code-freeze PR is open
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const prs = await github.paginate(github.rest.pulls.list, {
              owner,
              repo,
              state: 'open',
              base: 'stage',
              head: `${owner}:dev`,
              per_page: 100,
            });

            const freezePR = prs.find((pr) =>
              (pr.labels || []).some((label) => label.name === 'code-freeze')
            );

            if (freezePR) {
              core.setFailed(
                `Code freeze is active via PR #${freezePR.number} (${freezePR.html_url}). ` +
                `Merges into dev are blocked until this dev->stage PR is merged or 'code-freeze' label is removed.`
              );
              return;
            }

            core.info('No active code-freeze PR found. Merges to dev are allowed.');

  unfreeze-dev-after-stage-merge:
    if: ${{ github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'stage' && github.event.pull_request.head.ref == 'dev' }}
    runs-on: ubuntu-latest
    steps:
      - name: Remove code-freeze label from open PRs
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const openPRs = await github.paginate(github.rest.pulls.list, {
              owner,
              repo,
              state: 'open',
              per_page: 100,
            });

            const freezePRs = openPRs.filter((pr) =>
              (pr.labels || []).some((label) => label.name === 'code-freeze')
            );

            for (const pr of freezePRs) {
              try {
                await github.rest.issues.removeLabel({
                  owner,
                  repo,
                  issue_number: pr.number,
                  name: 'code-freeze',
                });
                core.info(`Removed code-freeze from PR #${pr.number}.`);
              } catch (error) {
                if (error.status === 404) {
                  continue;
                }
                throw error;
              }
            }

            core.info(`Unfreeze complete. Updated ${freezePRs.length} PR(s).`);

  delete-merged-source-branch:
    if: ${{ github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'dev' }}
    runs-on: ubuntu-latest
    steps:
      - name: Delete merged source branch when safe
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            if (pr.head.repo.full_name !== `${owner}/${repo}`) {
              core.info('Source branch is from a fork. Skipping auto-delete.');
              return;
            }

            const headRef = pr.head.ref;
            const protectedBranches = new Set(['main', 'stage', 'dev']);
            if (protectedBranches.has(headRef)) {
              core.info(`Skipping protected branch '${headRef}'.`);
              return;
            }

            await github.rest.git.deleteRef({ owner, repo, ref: `heads/${headRef}` });
            core.info(`Deleted merged branch '${headRef}'.`);

  create-dev-to-stage-release-pr:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.flow == 'create-dev-to-stage' }}
    runs-on: ubuntu-latest
    steps:
      - name: Create or update stage release PR (dev -> stage)
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PR_AUTOMATION_TOKEN || github.token }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            let stageReleasePrNumber = null;

            const existing = await github.rest.pulls.list({
              owner,
              repo,
              state: 'open',
              base: 'stage',
              head: `${owner}:dev`,
              per_page: 10,
            });

            if (existing.data.length > 0) {
              const pr = existing.data[0];
              stageReleasePrNumber = pr.number;
              const hasFreeze = (pr.labels || []).some((l) => l.name === 'code-freeze');
              if (!hasFreeze) {
                await github.rest.issues.addLabels({ owner, repo, issue_number: pr.number, labels: ['code-freeze'] });
              }
              core.info(`Existing stage release PR: #${pr.number} ${pr.html_url}`);
            } else {
              const now = new Date().toISOString().slice(0, 10);
              try {
                const created = await github.rest.pulls.create({
                  owner,
                  repo,
                  title: `stage release: dev to stage (${now})`,
                  head: 'dev',
                  base: 'stage',
                  draft: true,
                  body: [
                    'Automated stage release PR generated from `dev` to `stage`.',
                    '',
                    '- `code-freeze` is active while this PR is open.',
                    '- This PR is intentionally created as draft to prevent immediate merge.',
                  ].join('\n'),
                  maintainer_can_modify: true,
                });

                stageReleasePrNumber = created.data.number;
                await github.rest.issues.addLabels({ owner, repo, issue_number: created.data.number, labels: ['code-freeze'] });
                core.info(`Created stage release PR: #${created.data.number} ${created.data.html_url}`);
              } catch (error) {
                if (error.status === 403 && String(error.message).includes('not permitted to create or approve pull requests')) {
                  core.setFailed(
                    "PR creation is blocked for GITHUB_TOKEN. Enable 'Allow GitHub Actions to create and approve pull requests' in repository Actions settings, or set secret PR_AUTOMATION_TOKEN with repo scope."
                  );
                  return;
                }
                throw error;
              }
            }

            // Mark all open PRs targeting dev as code-freeze (except the stage release PR itself).
            const devPrs = await github.paginate(github.rest.pulls.list, {
              owner,
              repo,
              state: 'open',
              base: 'dev',
              per_page: 100,
            });

            for (const pr of devPrs) {
              if (pr.number === stageReleasePrNumber) continue;
              const hasFreeze = (pr.labels || []).some((l) => l.name === 'code-freeze');
              if (hasFreeze) continue;
              await github.rest.issues.addLabels({
                owner,
                repo,
                issue_number: pr.number,
                labels: ['code-freeze'],
              });
              core.info(`Added code-freeze label to PR #${pr.number}.`);
            }

  create-stage-to-main-release-pr:
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.flow == 'create-stage-to-main') }}
    runs-on: ubuntu-latest
    steps:
      - name: Create or update release PR (stage -> main)
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PR_AUTOMATION_TOKEN || github.token }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const existing = await github.rest.pulls.list({
              owner,
              repo,
              state: 'open',
              base: 'main',
              head: `${owner}:stage`,
              per_page: 10,
            });

            if (existing.data.length > 0) {
              const pr = existing.data[0];
              core.info(`Release PR already exists: #${pr.number} ${pr.html_url}`);
              return;
            }

            const now = new Date().toISOString().slice(0, 10);
            try {
              const pr = await github.rest.pulls.create({
                owner,
                repo,
                title: `release: stage to main (${now})`,
                head: 'stage',
                base: 'main',
                body: [
                  'Automated release PR generated from `stage` to `main`.',
                  '',
                  '- Source branch: `stage`',
                  '- Target branch: `main`',
                ].join('\n'),
                maintainer_can_modify: true,
              });

              core.info(`Created release PR: #${pr.data.number} ${pr.data.html_url}`);
            } catch (error) {
              if (error.status === 403 && String(error.message).includes('not permitted to create or approve pull requests')) {
                core.setFailed(
                  "PR creation is blocked for GITHUB_TOKEN. Enable 'Allow GitHub Actions to create and approve pull requests' in repository Actions settings, or set secret PR_AUTOMATION_TOKEN with repo scope."
                );
                return;
              }
              throw error;
            }
