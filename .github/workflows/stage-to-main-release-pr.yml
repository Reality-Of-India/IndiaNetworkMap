name: Create Stage To Main Release PR

on:
  push:
    branches:
      - stage
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  create-release-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Create or update release PR (stage -> main)
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const existing = await github.rest.pulls.list({
              owner,
              repo,
              state: 'open',
              base: 'main',
              head: `${owner}:stage`,
              per_page: 10,
            });

            if (existing.data.length > 0) {
              const pr = existing.data[0];
              core.info(`Release PR already exists: #${pr.number} ${pr.html_url}`);
              return;
            }

            const now = new Date().toISOString().slice(0, 10);
            const pr = await github.rest.pulls.create({
              owner,
              repo,
              title: `release: stage to main (${now})`,
              head: 'stage',
              base: 'main',
              body: [
                'Automated release PR generated from `stage` to `main`.',
                '',
                '- Source branch: `stage`',
                '- Target branch: `main`',
                '- Trigger: push to `stage`',
              ].join('\n'),
              maintainer_can_modify: true,
            });

            core.info(`Created release PR: #${pr.data.number} ${pr.data.html_url}`);
