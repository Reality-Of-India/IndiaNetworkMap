name: Routine Checks for PRs to Dev

on:
  pull_request:
    branches: [dev]
    types: [opened, reopened, synchronize, ready_for_review, labeled, unlabeled, edited, closed]

permissions:
  contents: write
  pull-requests: read

jobs:
  validate-dev-pr:
    if: ${{ github.event.action != 'closed' }}
    runs-on: ubuntu-latest
    steps:
      - name: Block merges to dev during code freeze
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const currentPr = context.payload.pull_request;

            const freezePrs = await github.paginate(github.rest.pulls.list, {
              owner,
              repo,
              state: 'open',
              base: 'stage',
              head: `${owner}:dev`,
              per_page: 100,
            });

            const activeFreeze = freezePrs.find((pr) =>
              (pr.labels || []).some((label) => label.name === 'code-freeze')
            );

            if (activeFreeze) {
              core.setFailed(
                `Code freeze is active via PR #${activeFreeze.number} (${activeFreeze.html_url}). ` +
                `Merges into dev are blocked until the dev->stage release PR is merged or freeze is removed.`
              );
              return;
            }

            core.info(`Dev PR #${currentPr.number} passed route checks.`);

  delete-merged-source-branch:
    if: ${{ github.event.action == 'closed' && github.event.pull_request.merged == true }}
    runs-on: ubuntu-latest
    steps:
      - name: Delete merged source branch when safe
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            if (pr.head.repo.full_name !== `${owner}/${repo}`) {
              core.info('Source branch is from a fork. Skipping auto-delete.');
              return;
            }

            const headRef = pr.head.ref;
            const protectedBranches = new Set(['main', 'stage', 'dev']);
            if (protectedBranches.has(headRef)) {
              core.info(`Skipping protected branch '${headRef}'.`);
              return;
            }

            await github.rest.git.deleteRef({ owner, repo, ref: `heads/${headRef}` });
            core.info(`Deleted merged branch '${headRef}'.`);
