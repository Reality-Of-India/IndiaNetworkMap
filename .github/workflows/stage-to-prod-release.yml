name: Stage To Prod Release

on:
  push:
    branches: [stage]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  create-stage-to-main-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Create or update release PR (stage -> main)
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PR_AUTOMATION_TOKEN || github.token }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const existing = await github.rest.pulls.list({
              owner,
              repo,
              state: 'open',
              base: 'main',
              head: `${owner}:stage`,
              per_page: 10,
            });

            if (existing.data.length > 0) {
              core.info(`Release PR already exists: #${existing.data[0].number} ${existing.data[0].html_url}`);
              return;
            }

            const now = new Date().toISOString().slice(0, 10);
            const created = await github.rest.pulls.create({
              owner,
              repo,
              title: `release: stage to main (${now})`,
              head: 'stage',
              base: 'main',
              body: [
                'Automated release PR generated from `stage` to `main`.',
                '',
                '- Source branch: `stage`',
                '- Target branch: `main`',
              ].join('\n'),
              maintainer_can_modify: true,
            });

            core.info(`Created stage->main PR: #${created.data.number} ${created.data.html_url}`);
