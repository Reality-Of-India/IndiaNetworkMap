name: Dev To Stage Movement

on:
  workflow_dispatch:
  pull_request:
    branches: [stage]
    types: [closed]

permissions:
  contents: write
  pull-requests: write

jobs:
  create-dev-to-stage-pr-and-freeze:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - name: Create/update dev->stage release PR and freeze dev PRs
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PR_AUTOMATION_TOKEN || github.token }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const existing = await github.rest.pulls.list({
              owner,
              repo,
              state: 'open',
              base: 'stage',
              head: `${owner}:dev`,
              per_page: 10,
            });

            const delta = await github.rest.repos.compareCommitsWithBasehead({
              owner,
              repo,
              basehead: 'stage...dev',
            });
            if (delta.data.ahead_by === 0) {
              core.info('No new commits to release from dev to stage. Skipping PR creation/update.');
              return;
            }

            let stageReleasePr;
            const now = new Date().toISOString().slice(0, 10);
            const expectedTitle = `chore(${now}): release dev to stage`;
            if (existing.data.length > 0) {
              stageReleasePr = existing.data[0];
              if (stageReleasePr.title !== expectedTitle) {
                await github.rest.pulls.update({
                  owner,
                  repo,
                  pull_number: stageReleasePr.number,
                  title: expectedTitle,
                });
                core.info(`Updated dev->stage PR title to '${expectedTitle}'.`);
              }
              if (stageReleasePr.draft) {
                await github.graphql(
                  `
                    mutation($pullRequestId: ID!) {
                      markPullRequestReadyForReview(input: { pullRequestId: $pullRequestId }) {
                        pullRequest {
                          number
                          isDraft
                        }
                      }
                    }
                  `,
                  { pullRequestId: stageReleasePr.node_id }
                );
                core.info(`Converted dev->stage PR #${stageReleasePr.number} to ready for review.`);
              }
              core.info(`Existing dev->stage PR: #${stageReleasePr.number} ${stageReleasePr.html_url}`);
            } else {
              stageReleasePr = (await github.rest.pulls.create({
                owner,
                repo,
                title: expectedTitle,
                head: 'dev',
                base: 'stage',
                draft: false,
                body: [
                  'Automated stage release PR from `dev` to `stage`.',
                  '',
                  '- This enables code freeze on eligible dev PRs.',
                  '- PR is created as ready for review.',
                ].join('\n'),
                maintainer_can_modify: true,
              })).data;
              core.info(`Created dev->stage PR: #${stageReleasePr.number} ${stageReleasePr.html_url}`);
            }

            const ensureLabel = async (issue_number, label) => {
              const issue = await github.rest.issues.get({ owner, repo, issue_number });
              const hasLabel = (issue.data.labels || []).some((l) => (typeof l === 'string' ? l : l.name) === label);
              if (!hasLabel) {
                await github.rest.issues.addLabels({ owner, repo, issue_number, labels: [label] });
              }
            };

            const devPrs = await github.paginate(github.rest.pulls.list, {
              owner,
              repo,
              state: 'open',
              base: 'dev',
              per_page: 100,
            });

            for (const pr of devPrs) {
              if (pr.number === stageReleasePr.number) continue;
              if (pr.draft) continue; // only freeze PRs that are ready for review
              // Exclude release route PR patterns explicitly, even if they shouldn't target dev.
              if (
                (pr.base.ref === 'main' && pr.head.ref === 'stage') ||
                (pr.base.ref === 'stage' && pr.head.ref === 'dev')
              ) {
                continue;
              }
              await ensureLabel(pr.number, 'code-freeze');
              core.info(`Applied code-freeze to PR #${pr.number}.`);
            }

  unfreeze-when-dev-to-stage-merged:
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'stage' && github.event.pull_request.head.ref == 'dev' }}
    runs-on: ubuntu-latest
    steps:
      - name: Remove code-freeze label from open dev PRs
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PR_AUTOMATION_TOKEN || github.token }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const devPrs = await github.paginate(github.rest.pulls.list, {
              owner,
              repo,
              state: 'open',
              base: 'dev',
              per_page: 100,
            });

            for (const pr of devPrs) {
              try {
                await github.rest.issues.removeLabel({
                  owner,
                  repo,
                  issue_number: pr.number,
                  name: 'code-freeze',
                });
                core.info(`Removed code-freeze from PR #${pr.number}.`);
              } catch (error) {
                if (error.status !== 404) throw error;
              }
            }

      - name: Back-merge stage into dev to preserve ancestry
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PR_AUTOMATION_TOKEN || github.token }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            try {
              const result = await github.rest.repos.merge({
                owner,
                repo,
                base: 'dev',
                head: 'stage',
                commit_message: 'chore(sync): back-merge stage into dev after release cut',
              });
              core.info(`Back-merge complete: ${result.data.sha}`);
            } catch (error) {
              if (error.status === 204 || error.status === 201) return;
              if (error.status === 409) {
                core.setFailed('Back-merge stage -> dev has conflicts. Resolve manually to keep branch ancestry aligned.');
                return;
              }
              if (error.status === 422) {
                core.info('No back-merge needed (already up to date).');
                return;
              }
              throw error;
            }
